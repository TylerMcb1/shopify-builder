appId: com.shopifybuilder.app
productName: Shopify Builder
copyright: Copyright © Shopify Builder
directories:
  output: release
files:
  - out/**
  - resources/**
asar: true
# Dugite runs its bundled git from app.asar.unpacked; a binary inside the archive cannot be spawned.
asarUnpack:
  - node_modules/dugite/git/**
mac:
  target: [dmg]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
win:
  target:
    - nsis
  signAndEditExecutable: true
publish:
  provider: github
  owner: TylerMcb1
  repo: shopify-builder
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
publish:
  provider: generic
  url: https://updates.example.com/shopify-builder/win
