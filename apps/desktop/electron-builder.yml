appId: com.shopifybuilder.app
productName: Shopify Builder
copyright: Copyright © Shopify Builder
directories:
  output: release
files:
  - out/**
  - resources/**
asar: true
# Dugite runs its bundled git from app.asar.unpacked; a binary inside the archive cannot be spawned.
asarUnpack:
  - node_modules/dugite/git/**
mac:
  # Built on an Apple Silicon runner; Dugite's bundled git matches the build machine's architecture.
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  # Ad-hoc signature until there is a Developer ID certificate. Without any signature, Gatekeeper reports
  # a downloaded app as damaged. Notarization is skipped unless the APPLE_* variables are set.
  identity: '-'
  hardenedRuntime: true
  notarize: true
win:
  target:
    - nsis
  signAndEditExecutable: true
publish:
  provider: github
  owner: TylerMcb1
  repo: shopify-builder
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
