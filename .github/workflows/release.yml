name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  # One draft for every platform; each build job uploads its installer into it.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # electron-builder publishes to v<package.json version>, not to the pushed tag. A mismatch
      # builds everything and then skips the upload, so stop before building.
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version. Set that version to ${GITHUB_REF_NAME#v}, commit, and tag the new commit."
            exit 1
          fi
      - run: gh release create ${{ github.ref_name }} --draft --title ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, dist: 'dist:win' }
          - { os: macos-latest, dist: 'dist:mac' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm ci
        working-directory: packages/host
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run ${{ matrix.dist }}
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
