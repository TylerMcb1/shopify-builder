name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}
jobs:
  # One draft for every platform. Each build uploads its installer into it, and the release is
  # published only after every installer is attached.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The installers and update files are named from apps/desktop/package.json, so the version
      # there has to match the tag.
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match apps/desktop/package.json version $version. Set that version to ${TAG#v}, commit, and tag the new commit."
            exit 1
          fi
      - name: Create the draft release
        run: gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --verify-tag
  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, dist: 'dist:win', files: 'Shopify-Builder-Setup-*.exe Shopify-Builder-Setup-*.exe.blockmap latest.yml' }
          - { os: macos-latest, dist: 'dist:mac', files: 'Shopify-Builder-*.dmg Shopify-Builder-*.dmg.blockmap latest-mac.yml' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm ci
        working-directory: packages/host
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run ${{ matrix.dist }}
        working-directory: apps/desktop
      # gh fails when a file pattern matches nothing, so a missing installer fails the run.
      - name: Upload to the release
        shell: bash
        working-directory: apps/desktop/release
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --draft=false --latest
